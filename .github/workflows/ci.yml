name: CI

on:
  pull_request:
  push:
    branches: [native-client2]
    tags: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================
  # LAYER 1: PARALLEL CI JOBS
  # ============================================

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - run: bun run format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - run: bunx svelte-kit sync
      - run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - run: bunx svelte-kit sync
      - run: bun run test

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - run: bun run i18n:check
      - run: bun run i18n:validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: 1
          format: 'table'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore
          scanners: ${{ github.event_name == 'pull_request' && 'vuln,license' || 'vuln,secret,misconfig,license' }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - run: bunx svelte-kit sync
      - run: bunx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      # - run: bunx houdini generate # TODO
      - run: bun run check

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - run: bunx svelte-kit sync
      - run: bunx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      # - run: bunx houdini generate # TODO
      - run: bun run build

  # ============================================
  # LAYER 2: NATIVE CLIENT BUILD (push only)
  # ============================================

  tauri-build:
    if: github.event_name == 'push'
    needs: [format, lint, test, i18n, security, typecheck]
    environment: production
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            rust_targets: ''
            args: ''
          - platform: windows-latest
            rust_targets: ''
            args: ''
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bun

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf squashfs-tools

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_OIDC_AUTHORITY: ${{ vars.PUBLIC_OIDC_AUTHORITY }}
          PUBLIC_OIDC_CLIENT_ID: ${{ vars.PUBLIC_OIDC_CLIENT_ID }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          # Updater package signing (minisign). Generated via `tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: ${{ github.ref_type == 'tag' }}
          # NOTE: prereleases are excluded by GitHub's /releases/latest, which the
          # updater endpoint in tauri.conf.json points at. Auto-update therefore only
          # activates once a NON-prerelease (stable) version is published; alpha/beta/rc
          # builds are manual-download only. This is intentional.
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          args: ${{ matrix.args }}

      # The linuxdeploy GTK plugin sets GDK_BACKEND=x11 but EGL still picks up
      # WAYLAND_DISPLAY and fails with EGL_BAD_PARAMETER. Unset it so EGL uses
      # X11/XWayland throughout, and disable DMABuf as belt-and-suspenders.
      - name: Patch AppImage – fix EGL on Wayland
        if: matrix.platform == 'ubuntu-latest'
        run: |
          set -e
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" ! -name "*.AppImage.sig" | head -1)
          echo "Patching: $APPIMAGE"

          # Extract without FUSE
          "$APPIMAGE" --appimage-extract

          # After GDK_BACKEND=x11: unset WAYLAND_DISPLAY so EGL doesn't try
          # the Wayland platform, and disable the DMABuf renderer.
          sed -i '/^export GDK_BACKEND=x11/a unset WAYLAND_DISPLAY\nexport WEBKIT_DISABLE_DMABUF_RENDERER=1' \
            squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh

          # Download and run appimagetool without FUSE
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O /tmp/appimagetool && chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"

          rm -rf squashfs-root

      - name: Re-upload patched AppImage to release
        if: matrix.platform == 'ubuntu-latest' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" ! -name "*.AppImage.sig" | head -1)
          gh release upload "${{ github.ref_name }}" "$APPIMAGE" --clobber

  # ============================================
  # LAYER 3: RELEASE (tag push only)
  # ============================================

  release:
    if: github.ref_type == 'tag'
    needs: [tauri-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          body: |
            <div align="center">

            # MUNify CHASE `${{ github.ref_name }}`

            [![SvelteKit](https://img.shields.io/badge/SvelteKit-FF3E00?style=for-the-badge&logo=svelte&logoColor=white)](https://svelte.dev)
            [![Drizzle](https://img.shields.io/badge/Drizzle-C5F74F?style=for-the-badge&logo=drizzle&logoColor=black)](https://orm.drizzle.team)
            [![GraphQL](https://img.shields.io/badge/GraphQL-E10098?style=for-the-badge&logo=graphql&logoColor=white)](https://graphql.org)
            [![Tauri](https://img.shields.io/badge/Tauri-24C8D8?style=for-the-badge&logo=tauri&logoColor=white)](https://tauri.app)

            </div>

            ### Native client downloads

            | Platform | File |
            |----------|------|
            | macOS (Universal) | `.dmg` |
            | Windows | `.exe` (NSIS installer) |
            | Linux (Debian/Ubuntu) | `.deb` |
            | Linux (portable) | `.AppImage` |

            See the **Assets** section below for all downloadable files.

            > ℹ️ The app is distributed unsigned, so your OS may show a security warning on first launch. See the [installation guide](https://github.com/DeutscheModelUnitedNations/munify-chase/blob/main/docs/INSTALL.md) for how to get past it on each platform. Updates afterwards are automatic.

            ---

            <div align="center">
            <sub>A project by <a href="https://dmun.de">Deutsche Model United Nations (DMUN) e.V.</a></sub>
            <br>
            <sub>Proudly free and open source — built for the MUN community worldwide 🌍</sub>
            </div>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
