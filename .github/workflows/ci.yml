name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================
  # LAYER 1: PARALLEL CI JOBS
  # ============================================

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - run: bun run format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - run: bunx svelte-kit sync
      - run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - run: bunx svelte-kit sync
      - run: bun run test

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - run: bun run i18n:check
      - run: bun run i18n:validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: 1
          format: 'table'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore
          scanners: ${{ github.event_name == 'pull_request' && 'vuln,license' || 'vuln,secret,misconfig,license' }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - run: bunx svelte-kit sync
      - run: bunx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      # - run: bunx houdini generate # TODO
      - run: bun run check

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - run: bunx svelte-kit sync
      - run: bunx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      # - run: bunx houdini generate # TODO
      - run: bun run build

  # ============================================
  # LAYER 2: DOCKER BUILD (push only)
  # ============================================

  docker-build:
    if: github.event_name == 'push'
    needs: [format, lint, test, i18n, security, typecheck]
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: |
            latest=false
          images: |
            ghcr.io/${{ github.repository }}
            deutschemodelunitednations/chase
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # TODO we should consider not pushing when any vulnerabilities are found in the next step
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: ./Dockerfile
          cache-from: type=gha,scope=docker
          cache-to: type=gha,mode=max,scope=docker
          build-args: |
            VERSION=${{ github.ref_name }}
            SHA=${{ github.sha }}

      - id: split-tags
        run: echo "fragment=$(echo "${DOCKER_METADATA_OUTPUT_TAGS}" | head -n 1)" >> "$GITHUB_OUTPUT"

      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.split-tags.outputs.fragment }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore
          scanners: 'vuln,secret,misconfig'

      - name: Upload sourcemaps to Bugsink
        if: github.ref_type == 'tag' && env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_URL != ''
        env:
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'chase' }}
        run: |
          echo "::group::Extracting build artifacts from Docker image"
          CONTAINER_ID=$(docker create "${{ steps.split-tags.outputs.fragment }}")
          mkdir -p ./build-artifacts
          docker cp "$CONTAINER_ID:/app/release/build" ./build-artifacts/
          docker rm "$CONTAINER_ID"
          echo "Extracted build artifacts to ./build-artifacts/build"
          ls -la ./build-artifacts/build
          echo "::endgroup::"

          echo "::group::Installing sentry-cli v2 (v3 has Bugsink compatibility issues)"
          npm install -g @sentry/cli@2
          echo "::endgroup::"

          echo "::group::Injecting debug IDs into sourcemaps"
          sentry-cli sourcemaps inject ./build-artifacts/build
          echo "::endgroup::"

          echo "::group::Uploading sourcemaps to Bugsink (project: $SENTRY_PROJECT)"
          sentry-cli --url "$SENTRY_URL" sourcemaps \
            --org bugsinkhasnoorgs \
            --project "$SENTRY_PROJECT" \
            upload ./build-artifacts/build
          echo "Sourcemaps uploaded successfully"
          echo "::endgroup::"

      - name: Sourcemap upload skipped
        if: github.ref_type == 'tag' && (env.SENTRY_AUTH_TOKEN == '' || env.SENTRY_URL == '')
        run: |
          echo "::warning::Sourcemap upload skipped - SENTRY_AUTH_TOKEN or SENTRY_URL not configured"
          echo "To enable sourcemap uploads, add the following secrets to your repository:"
          echo "  - SENTRY_AUTH_TOKEN: Your Bugsink authentication token"
          echo "  - SENTRY_URL: Your Bugsink instance URL (e.g., https://bugsink.example.com/)"

  # ============================================
  # LAYER 3: RELEASE (tag push only)
  # ============================================

  release:
    if: github.ref_type == 'tag'
    needs: [docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            <div align="center">

            # MUNify CHASE `${{ github.ref_name }}`

            [![SvelteKit](https://img.shields.io/badge/SvelteKit-FF3E00?style=for-the-badge&logo=svelte&logoColor=white)](https://svelte.dev)
            [![Drizzle](https://img.shields.io/badge/Drizzle-C5F74F?style=for-the-badge&logo=drizzle&logoColor=black)](https://orm.drizzle.team)
            [![GraphQL](https://img.shields.io/badge/GraphQL-E10098?style=for-the-badge&logo=graphql&logoColor=white)](https://graphql.org)
            [![Docker](https://img.shields.io/badge/Docker-2496ED?style=for-the-badge&logo=docker&logoColor=white)](https://hub.docker.com/r/deutschemodelunitednations/chase)

            </div>

            ### Docker images

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.number }}
            ```

            <details><summary>DockerHub mirror</summary>

            ```bash
            docker pull deutschemodelunitednations/chase:${{ steps.version.outputs.number }}
            ```

            </details>

            ### Native client (desktop app)

            Installers for macOS (`.dmg`), Windows (`.exe`) and Linux (`.deb` / `.AppImage`)
            are built from the `native-client` branch and attached to this release
            automatically a few minutes after publication.

            > ℹ️ The app is distributed unsigned, so your OS may show a security warning on
            > first launch. See the [installation guide](https://github.com/DeutscheModelUnitedNations/munify-chase/blob/native-client/docs/INSTALL.md)
            > for how to get past it on each platform. Updates afterwards are automatic.

            ---

            <div align="center">
            <sub>A project by <a href="https://dmun.de">Deutsche Model United Nations (DMUN) e.V.</a></sub>
            <br>
            <sub>Proudly free and open source — built for the MUN community worldwide 🌍</sub>
            </div>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # LAYER 4: NATIVE CLIENT BUILD (tag push only)
  # ============================================
  # Builds the Tauri desktop app from the `native-client` branch and attaches
  # the installers (+ updater artifacts) to the release created above. The
  # Sync Native Client workflow merges main into native-client on every push,
  # so by the time a tag lands the branch normally already contains the
  # released code — the wait step below only bridges the race between the two
  # workflows. If the sync is stuck on a conflict, this job times out; resolve
  # the sync PR and re-run it.

  native-client-build:
    if: github.ref_type == 'tag'
    needs: [release]
    environment: production
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to the oldest supported LTS so the AppImage/deb link against
          # an old glibc and run on older distros (see Tauri AppImage docs).
          - platform: ubuntu-22.04
            rust_targets: ''
            args: ''
          - platform: windows-latest
            rust_targets: ''
            args: ''
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: native-client
          fetch-depth: 0

      - name: Wait for native-client to contain the released commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
              echo "native-client contains $GITHUB_SHA."
              exit 0
            fi
            echo "Attempt $attempt/30: native-client does not yet contain $GITHUB_SHA, retrying in 30s…"
            if [ "$attempt" -eq 10 ]; then
              echo "::warning::Still waiting after 10 attempts. If the commit is not picked up soon, check the open PRs — the Sync Native Client workflow may have created a PR to resolve a merge conflict that needs manual approval."
            fi
            sleep 30
            git fetch origin native-client --quiet
            git reset --hard origin/native-client --quiet
          done
          echo "::error::native-client never picked up ${GITHUB_REF_NAME} (${GITHUB_SHA}). The Sync Native Client workflow probably hit a merge conflict — resolve its PR, then re-run this job."
          exit 1

      - uses: ./.github/actions/setup-bun

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_OIDC_AUTHORITY: ${{ vars.PUBLIC_OIDC_AUTHORITY }}
          PUBLIC_OIDC_CLIENT_ID: ${{ vars.PUBLIC_OIDC_CLIENT_ID }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          # Updater package signing (minisign). Generated via `tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Attach the artifacts to the release the `release` job created for
          # this tag. tauri-action finds the existing release by tag name.
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          # NOTE: prereleases are excluded by GitHub's /releases/latest, which the
          # updater endpoint in tauri.conf.json points at. Auto-update therefore only
          # activates once a NON-prerelease (stable) version is published; alpha/beta/rc
          # builds are manual-download only. This is intentional.
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          args: ${{ matrix.args }}

      # NOTE: no post-build AppImage patching here. The Wayland/DMABuf EGL
      # workarounds live in src-tauri/src/lib.rs on the native-client branch —
      # patching the AppImage after the build would invalidate the updater's
      # minisign signature and break auto-updates on Linux.
