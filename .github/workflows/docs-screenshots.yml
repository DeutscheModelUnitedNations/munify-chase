name: Docs screenshots

# Regenerates the manual screenshots from the real app and opens (or updates) a PR
# when they changed, so the manual never shows an outdated UI.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'messages/**'
      - 'scripts/docs-screenshots/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - run: cp .env.example .env
      - run: bunx svelte-kit sync
      - run: bunx playwright install --with-deps chromium
      - run: bun run docs:screenshots
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: docs/screenshots
          add-paths: static/docs-assets/screenshots
          commit-message: 'docs: regenerate manual screenshots'
          title: 'docs: regenerate manual screenshots'
          body: Screenshots regenerated by `bun run docs:screenshots` after changes on main.
          labels: documentation
          delete-branch: true
