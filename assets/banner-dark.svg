  <text x="50" y="181" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#7288ab">Free, open-source debate management for Model United Nations conferences.</text><g filter="url(#softd)"><rect x="48" y="202" width="744" height="66" rx="12"
