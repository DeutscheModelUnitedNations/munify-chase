    <animate attributeName="cx" values="120;190;120" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22;0.12;0.22" dur="14s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="740" cy="250" rx="140" ry="120" fill="#e3a545" opacity="0.15" filter="url(#glowd)">
    <animate attributeName="cy" values="250;190;250" dur="17s" repeatCount="indefinite"/></ellipse><text x="48" y="58" font-family="'SF Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10" letter-spacing="3.4"
    fill="#7288ab">DEUTSCHE MODEL UNITED NATIONS e.V.  ·  MUNIFY</text><text x="48" y="122" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="58" letter-spacing="-1">
