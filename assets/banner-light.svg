<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img">
  <defs>
    <linearGradient id="bgl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eaf1fb"/>
      <stop offset="100%" stop-color="#e1ebf9"/>
    </linearGradient>
    <pattern id="gridl" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#2a6ac4" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="glowl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="softl" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1e3050" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="fadel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a6ac4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2a6ac4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2a6ac4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <defs>
    <linearGradient id="wordl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a6ac4"/>
      <stop offset="50%" stop-color="#1e3050"/>
      <stop offset="100%" stop-color="#2a6ac4"/>
      <animate attributeName="x1" values="-90%;10%;-90%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="10%;110%;10%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="timerl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8701a"/>
      <stop offset="100%" stop-color="#c1382c"/>
    </linearGradient>
  </defs><rect width="840" height="300" rx="0" fill="url(#bgl)"/><rect width="840" height="300" rx="0" fill="url(#gridl)"/><ellipse cx="120" cy="40" rx="150" ry="120" fill="#2a6ac4" opacity="0.16" filter="url(#glowl)">
    <animate attributeName="cx" values="120;190;120" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.16;0.09;0.16" dur="14s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="740" cy="250" rx="140" ry="120" fill="#a8701a" opacity="0.11" filter="url(#glowl)">
    <animate attributeName="cy" values="250;190;250" dur="17s" repeatCount="indefinite"/></ellipse><text x="48" y="58" font-family="'SF Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10" letter-spacing="3.4"
    fill="#68809f">DEUTSCHE MODEL UNITED NATIONS e.V.  ·  MUNIFY</text><text x="48" y="122" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="58" letter-spacing="-1">
