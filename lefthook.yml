pre-commit:
  parallel: false
  commands:
    format:
      priority: 1
      run: bunx prettier --ignore-unknown --write "{staged_files}"
      stage_fixed: true
    fallow:
      priority: 2
      glob: '*.{ts,js,svelte,css,json}'
      # Audits the commit against HEAD and only fails on findings this commit
      # introduces — the existing backlog is reported but never blocks.
      run: bunx fallow audit --base HEAD
      fail_text: 'fallow found issues introduced by this commit. Inspect with `bun run fallow:audit`, or bypass with `git commit --no-verify`.'
      # A merge or rebase brings in commits that were each audited already; judging
      # the whole branch as new would block it on what it was allowed to carry.
      skip:
        - merge
        - rebase
# The same checks as the CI jobs, over the whole repo rather than the pushed files: a commit made
# with --no-verify is caught by the next push instead of by CI.
pre-push:
  parallel: true
  # Nothing to check when the branch has no commits its remote lacks, such as a push of a tag
  # alone. Without an upstream (a new branch) the comparison fails, and the checks run.
  skip:
    - run: git diff --quiet '@{push}' HEAD
  commands:
    format:
      run: bun run format:check
    lint:
      # not cached: the config holds a function (`compilerOptions.warningFilter`), which ESLint's cache cannot store
      run: bun run lint
    typecheck:
      run: bun run check
    test:
      run: bun run test
    i18n:
      run: bun run i18n:check
