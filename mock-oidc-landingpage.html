<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<title>CHASE Mock OAuth2 Server</title>

		<link
			rel="stylesheet"
			href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
			integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
			crossorigin="anonymous"
		/>
		<style>
			.presets-container {
				margin-bottom: 20px;
			}
			.preset-btn {
				margin: 0 5px 5px 0;
			}
		</style>
		<script>
			const presets = [
				{
					id: 'Global Admin (John Doe)',
					claims: {
						email: 'admin@dmun.de',
						family_name: 'Doe',
						given_name: 'John',
						preferred_username: 'admin',
						locale: 'de',
						roles: [{ name: 'admin' }]
					}
				},
				{
					id: 'Conference Team (Jane Doe)',
					claims: {
						email: 'user@dmun.de',
						family_name: 'Doe',
						given_name: 'Jane',
						preferred_username: 'user',
						locale: 'de'
					}
				},
				{
					id: 'Delegate – Germany, General Assembly',
					claims: {
						email: 'gv.de@delegate.dev',
						family_name: 'Müller',
						given_name: 'Anna',
						preferred_username: 'gv.de',
						locale: 'de'
					}
				},
				{
					id: 'Delegate – France, General Assembly',
					claims: {
						email: 'gv.fr@delegate.dev',
						family_name: 'Dupont',
						given_name: 'Marie',
						preferred_username: 'gv.fr',
						locale: 'fr'
					}
				},
				{
					id: 'Delegate – United States, General Assembly',
					claims: {
						email: 'gv.us@delegate.dev',
						family_name: 'Smith',
						given_name: 'James',
						preferred_username: 'gv.us',
						locale: 'en'
					}
				},
				{
					id: 'Delegate – Brazil, General Assembly',
					claims: {
						email: 'gv.br@delegate.dev',
						family_name: 'Silva',
						given_name: 'Lucas',
						preferred_username: 'gv.br',
						locale: 'pt'
					}
				},
				{
					id: 'Delegate – Japan, General Assembly',
					claims: {
						email: 'gv.jp@delegate.dev',
						family_name: 'Tanaka',
						given_name: 'Yuki',
						preferred_username: 'gv.jp',
						locale: 'en'
					}
				},
				{
					id: 'Delegate – Nigeria, General Assembly',
					claims: {
						email: 'gv.ng@delegate.dev',
						family_name: 'Okafor',
						given_name: 'Emeka',
						preferred_username: 'gv.ng',
						locale: 'en'
					}
				},
				{
					id: 'Delegate – Argentina, General Assembly',
					claims: {
						email: 'gv.ar@delegate.dev',
						family_name: 'González',
						given_name: 'Sofía',
						preferred_username: 'gv.ar',
						locale: 'es'
					}
				}
			];

			function selectPreset(preset) {
				const usernameInput = document.querySelector('input[name="username"]');
				const claimsTextarea = document.querySelector('textarea[name="claims"]');

				usernameInput.value = preset.claims.preferred_username;
				claimsTextarea.value = JSON.stringify(preset.claims, null, 2);
			}
		</script>
	</head>

	<body>
		<div class="container">
			<div class="row justify-content-md-center mt-5">
				<div class="col-md-5">
					<h4>MUNify CHASE Mock OAuth2</h4>
					<div class="presets-container">
						<script>
							presets.forEach((preset, index) => {
								document.write(`
									<button type="button" 
											class="btn btn-secondary btn-sm preset-btn" 
											onclick="selectPreset(presets[${index}])">
										${preset.id}
									</button>
								`);
							});
						</script>
					</div>
					<form method="post">
						<hr class="divisor" />
						<div class="form-group">
							<input
								type="text"
								class="form-control"
								name="username"
								autofocus="on"
								placeholder="Enter any user/subject"
							/>
						</div>
						<div class="form-group">
							<textarea
								class="form-control"
								name="claims"
								rows="15"
								placeholder='Optional claims JSON value, example:
{
  "acr": "reference"
}'
							></textarea>
						</div>
						<div style="display: flex; justify-content: space-between">
							<a href="http://localhost:5173" class="topBtn btn btn-error">Cancel</a>
							<button type="submit" class="topBtn btn btn-primary">Sign-in</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</body>
</html>
