# oidc-mock configuration for local development (https://github.com/strehk/oidc-mock)
#
# Served by the Vite dev server through the `oidcMock()` plugin in vite.config.ts.
# Point the app at it with:
#   PUBLIC_OIDC_AUTHORITY=http://127.0.0.1:8090/oidc/.well-known/openid-configuration
#
# Edits to `users`, `clients`, `tokens` and `custom_login` apply without a restart.
# `host`, `port`, `base_path`, `issuer` and `key_file` need one.

host: 127.0.0.1
port: 8090
base_path: /oidc

# No `clients`: any client_id is accepted without a secret.

tokens:
  access_token_ttl: 1h
  id_token_ttl: 1h
  refresh_token_ttl: 30d

# Show the "custom claims" box on the login page.
custom_login: true

# One button per user on the login page. `sub` stays fixed per user, so the app sees the same
# account on every login. Roles use the Logto shape (`OIDC_ROLE_CLAIM=roles`).
users:
  - sub: admin
    label: Global Admin
    description: John Doe
    claims:
      email: admin@dmun.de
      family_name: Doe
      given_name: John
      preferred_username: admin
      locale: de
      roles: [{ name: admin }]

  - sub: user
    label: Conference Team
    description: Jane Doe
    claims:
      email: user@dmun.de
      family_name: Doe
      given_name: Jane
      preferred_username: user
      locale: de

  - sub: gv.de
    label: Delegate – Germany
