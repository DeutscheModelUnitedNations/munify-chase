<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<!-- The installed app's title bar takes the navbar's colour (base-100 of the DMUN themes);
		     the script below and setThemeInHTML keep it on the chosen theme -->
		<meta name="theme-color" content="#FFFFFF" />
		<!-- Favicons, manifest and launch images: BrandHead in the root layout (munify-brand) -->
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Set data-theme before first paint to avoid a flash of the wrong theme.
			// Mirrors the logic in src/lib/utils/theme.svelte.ts.
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var theme =
						!stored || stored === 'system' || stored === 'undefined'
							? window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light'
							: stored;
					document.documentElement.setAttribute('data-theme', theme);
					document
						.querySelector('meta[name="theme-color"]')
						.setAttribute('content', theme === 'dark' ? '#1B1837' : '#FFFFFF');
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'light');
				}
			})();
		</script>
		<style>
			body {
				margin: 0;
				padding: 0;
				min-height: 100vh;
			}
		</style>
		<script>
			// High contrast before the first paint, so the page never flashes in the other look.
			// Mirrors contrastIsMore in src/lib/helpers/contrast.ts
			try {
				var choice = localStorage.getItem('contrast');
				if (
					choice === 'more' ||
					(choice !== 'normal' && matchMedia('(prefers-contrast: more)').matches)
				) {
					document.documentElement.dataset.contrast = 'more';
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-base-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
