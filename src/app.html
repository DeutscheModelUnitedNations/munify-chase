<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="CHASE" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<!-- The installed app's title bar takes the navbar's colour (base-100 of the DMUN themes);
		     the script below and setThemeInHTML keep it on the chosen theme -->
		<meta name="theme-color" content="#FFFFFF" />
		<link rel="manifest" href="/site.webmanifest" />
		<link
			rel="stylesheet"
			href="https://cdn.dmun.de/cdn/fontawesome-pro-6.7.2/css/fontawesome.min.css"
		/>
		<link rel="stylesheet" href="https://cdn.dmun.de/cdn/fontawesome-pro-6.7.2/css/solid.min.css" />
		<link
			rel="stylesheet"
			href="https://cdn.dmun.de/cdn/fontawesome-pro-6.7.2/css/duotone.min.css"
		/>
		<link
			rel="stylesheet"
			href="https://cdn.dmun.de/cdn/fontawesome-pro-6.7.2/css/brands.min.css"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Set data-theme before first paint to avoid a flash of the wrong theme.
			// Mirrors the logic in src/lib/utils/theme.svelte.ts.
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var theme =
						!stored || stored === 'system' || stored === 'undefined'
							? window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light'
							: stored;
					document.documentElement.setAttribute('data-theme', theme);
					document
						.querySelector('meta[name="theme-color"]')
						.setAttribute('content', theme === 'dark' ? '#1B1837' : '#FFFFFF');
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'light');
				}
			})();
		</script>
		<style>
			body {
				margin: 0;
				padding: 0;
				min-height: 100vh;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-base-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
